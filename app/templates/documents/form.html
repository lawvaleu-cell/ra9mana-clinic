{% extends "base.html" %}
{% block title %}Nouveau document{% endblock %}
{% block extra_head %}
<link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet">
<style>
    .ql-toolbar.ql-snow { border-color: var(--border); border-radius: var(--radius-sm) var(--radius-sm) 0 0; background: var(--bg-surface-alt); }
    .ql-container.ql-snow { border-color: var(--border); border-radius: 0 0 var(--radius-sm) var(--radius-sm); min-height: 320px; font-size: 13.7px; background: var(--bg-surface); }
    .ql-editor { min-height: 320px; color: var(--text-primary); }
</style>
{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <div class="page-title">Nouveau document médical</div>
        <div class="page-subtitle">Patient : {{ patient.prenom }} {{ patient.nom }}</div>
    </div>
</div>

<form method="POST" class="card" style="max-width:820px;" id="doc-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-row">
        <div class="form-group">
            <label class="form-label">Type de document <span class="required">*</span></label>
            <select class="form-control" name="type_document" required>
                {% for key, label in types.items() %}<option value="{{ key }}">{{ label }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Titre du document <span class="required">*</span></label>
            <input class="form-control" name="titre" value="{{ form.titre or '' }}" placeholder="Ex : Certificat de bonne santé" required>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">Contenu <span class="required">*</span></label>
        <div id="editor">{{ form.contenu or '' }}</div>
        <input type="hidden" name="contenu" id="contenu-input">
    </div>

    <div class="flex gap-2" style="margin-top:18px;">
        <button type="submit" class="btn btn-primary">Créer le document</button>
        <a href="{{ url_for('patients.view_patient', patient_id=patient.id) }}" class="btn btn-secondary">Annuler</a>
    </div>
</form>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
<script>
const quill = new Quill('#editor', {
    theme: 'snow',
    placeholder: 'Rédigez librement le contenu du document…',
    modules: {
        toolbar: [
            [{ header: [2, 3, false] }],
            ['bold', 'italic', 'underline'],
            [{ list: 'ordered' }, { list: 'bullet' }],
            [{ align: [] }],
            ['clean']
        ]
    }
});
document.getElementById('doc-form').addEventListener('submit', () => {
    document.getElementById('contenu-input').value = quill.root.innerHTML;
});
</script>
{% endblock %}
