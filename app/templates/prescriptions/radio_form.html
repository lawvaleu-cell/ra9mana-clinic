{% extends "base.html" %}
{% block title %}Demande de radiologie{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <div class="page-title">Demande d'examen radiologique</div>
        <div class="page-subtitle">Patient : {{ patient.prenom }} {{ patient.nom }}</div>
    </div>
    <a href="{{ url_for('prescriptions.list_request_templates', type_demande='radiologie') }}" class="btn btn-secondary btn-sm">📋 Modèles</a>
</div>
<form method="POST" class="card" style="max-width:700px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if modeles %}
    <div class="form-group">
        <label class="form-label">Appliquer un modèle</label>
        <select class="form-control" onchange="if(this.value){fetch('/prescriptions/demande-modeles/'+this.value+'/json').then(r=>r.json()).then(d=>{if(d.ok)document.querySelector('[name=examens]').value=d.contenu;});}">
            <option value="">— Choisir un modèle —</option>
            {% for m in modeles %}<option value="{{ m.id }}">{{ m.nom }}</option>{% endfor %}
        </select>
    </div>
    {% endif %}
    <div class="form-group">
        <label class="form-label">Examens demandés <span class="required">*</span></label>
        <textarea class="form-control" name="examens" rows="6" placeholder="Un examen par ligne. Ex :&#10;Radiographie thoracique face&#10;Échographie abdominale" required></textarea>
    </div>
    <div class="form-group">
        <label class="form-label">Notes cliniques</label>
        <textarea class="form-control" name="notes" rows="2"></textarea>
    </div>
    <div class="flex gap-2">
        <button type="submit" class="btn btn-primary">Créer la demande</button>
        <a href="{{ url_for('patients.view_patient', patient_id=patient.id) }}" class="btn btn-secondary">Annuler</a>
    </div>
</form>
{% endblock %}
