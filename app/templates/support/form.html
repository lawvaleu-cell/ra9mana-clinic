{% extends "base.html" %}
{% block title %}Nouvelle conversation{% endblock %}
{% block content %}
<div class="page-header"><div class="page-title">Nouvelle conversation avec le support</div></div>
<form method="POST" class="card" style="max-width:640px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
        <label class="form-label">Sujet <span class="required">*</span></label>
        <input class="form-control" name="sujet" required placeholder="Ex : Question sur la facturation">
    </div>
    <div class="form-group">
        <label class="form-label">Message <span class="required">*</span></label>
        <textarea class="form-control" name="message" rows="6" required placeholder="Décrivez votre question ou problème…"></textarea>
    </div>
    <div class="flex gap-2">
        <button type="submit" class="btn btn-primary">Envoyer</button>
        <a href="{{ url_for('support.list_tickets') }}" class="btn btn-secondary">Annuler</a>
    </div>
</form>
{% endblock %}
