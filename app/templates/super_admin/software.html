{% extends "super_admin/base.html" %}
{% block title %}Gestion logicielle{% endblock %}
{% block content %}
<div class="page-header"><div class="page-title">Gestion logicielle</div></div>

<form method="POST" class="card" style="max-width:700px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
        <label class="form-label">Version de l'application</label>
        <input class="form-control" name="version_application" value="{{ parametres.get('version_application', '1.0.0') }}">
    </div>
    <div class="form-group checkbox-row" style="margin-bottom:16px;">
        <input type="checkbox" id="mode_maintenance" name="mode_maintenance" value="1" {{ 'checked' if parametres.get('mode_maintenance') == '1' }}>
        <label class="form-label" for="mode_maintenance" style="margin:0;">Activer le mode maintenance (accès bloqué pour toutes les cliniques)</label>
    </div>
    <div class="form-group">
        <label class="form-label">Notes de version</label>
        <textarea class="form-control" name="notes_version" rows="5">{{ parametres.get('notes_version', '') }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Enregistrer</button>
</form>
{% endblock %}
