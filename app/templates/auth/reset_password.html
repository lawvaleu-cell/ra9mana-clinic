<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>Réinitialiser le mot de passe — {{ app_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
<div class="flash-container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}<div class="flash flash-{{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
</div>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo"><span class="logo-mark" style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;">🩺</span> {{ app_name }}</div>
        <h2 style="margin:0 0 4px;">Nouveau mot de passe</h2>
        <p class="text-secondary" style="margin:0 0 24px;font-size:13.5px;">Choisissez un nouveau mot de passe sécurisé.</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label">Nouveau mot de passe</label>
                <input class="form-control" type="password" name="mot_de_passe" required autofocus>
                <div class="form-hint">8 caractères minimum</div>
            </div>
            <div class="form-group">
                <label class="form-label">Confirmer le mot de passe</label>
                <input class="form-control" type="password" name="confirmation" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Réinitialiser</button>
        </form>
    </div>
</div>
</body>
</html>
