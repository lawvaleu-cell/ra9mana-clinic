<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ 'rtl' if is_rtl else 'ltr' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ titre }} — {{ app_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
<link rel="icon" href="{{ url_for('documents.serve_upload', filename=site_logo.split('/')[-1]) if site_logo else url_for('static', filename='icons/icon-192.png') }}">
<style>
    .legal-wrap { max-width: 760px; margin: 0 auto; padding: 60px 24px 80px; }
    .legal-wrap h1 { font-size: 28px; margin-bottom: 8px; }
    .legal-wrap .legal-body { white-space: pre-line; font-size: 14px; line-height: 1.8; color: var(--lp-text-muted); margin-top: 24px; }
    .legal-badge { display: inline-flex; align-items: center; gap: 6px; background: #E7F9F1; color: #047857; font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 999px; margin-top: 14px; }
</style>
</head>
<body class="lp-body">
<nav class="lp-navbar">
    <div class="lp-navbar-inner">
        <div class="lp-logo">
            <img src="{{ url_for('documents.serve_upload', filename=site_logo.split('/')[-1]) if site_logo else url_for('static', filename='brand/logo.png') }}" alt="{{ app_name }}" style="height:28px;width:auto;">
            {{ app_name }}
        </div>
        <a href="{{ url_for('site.landing') }}" class="lp-btn lp-btn-ghost">← Retour à l'accueil</a>
    </div>
</nav>
<div class="legal-wrap">
    <h1>{{ titre }}</h1>
    <span class="legal-badge">✓ Conforme aux exigences légales applicables</span>
    <div class="legal-body">{{ texte }}</div>

    {% if content.support_juridique %}
    <div style="margin-top:40px;padding:20px;background:#F7F9FC;border-radius:16px;border:1px solid var(--lp-border);">
        <strong style="font-size:13.5px;">⚖️ Support juridique</strong>
        <p style="font-size:13px;color:var(--lp-text-muted);margin-top:8px;line-height:1.6;">{{ content.support_juridique }}</p>
    </div>
    {% endif %}
</div>
</body>
</html>
